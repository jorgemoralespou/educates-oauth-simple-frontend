name: Build and Publish Container Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      security-events: read
      id-token: write       # Required for OIDC keyless attestation
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        # Pinned to v2.x: cosign v3 defaults (new bundle format + TUF signing
        # config) write signatures as OCI 1.1 referrers, which GHCR does not
        # support and Chainloop's artifact-signed policy does not read. v3's
        # `--new-bundle-format=false` is incompatible with the v3 signing-config
        # default, so the cleanest fix is to stay on v2 where the legacy
        # `sha256-<digest>.sig` tag is the default.
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v2.6.1

      - name: Sign container image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Verify signature is discoverable in registry
        # Catches future regressions: if the .sig tag is missing in the
        # registry this step fails before Chainloop ever sees the image.
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Scan for vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif

      # Export GHAS Dependency Scan (Dependabot alerts)
      - name: Export GHAS Dependency Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SECURITY_PAT }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/dependabot/alerts?per_page=100&state=open" \
            > ghas-dep-scan.json

      # Export GHAS Code Scan (CodeQL / code scanning alerts)
      - name: Export GHAS Code Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SECURITY_PAT }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/code-scanning/alerts?per_page=100&state=open" \
            > ghas-code-scan.json

      - name: Install Chainloop CLI
        run: curl -sfL https://dl.chainloop.dev/cli/install.sh | bash -s

      - name: Initialize Chainloop attestation
        run: |
          chainloop attestation init \
            --workflow educates-simple-oauth-frontend \
            --project educates-simple-oauth-frontend \
            --collectors aiconfig

      - name: Add container image material
        run: |
          chainloop attestation add \
            --name my-container-image \
            --value ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Add SBOM material
        run: |
          chainloop attestation add \
            --name sbom \
            --value sbom.cyclonedx.json

      - name: Add vulnerability report material
        run: |
          chainloop attestation add \
            --name vulnerability-report \
            --value trivy-results.sarif

      - name: Add GHAS Dependency Scan material
        run: |
          chainloop attestation add \
            --name ghas-dep-scan \
            --value ghas-dep-scan.json \
            --type GHAS_DEPENDENCY_SCAN

      - name: Add GHAS Code Scan material
        run: |
          chainloop attestation add \
            --name ghas-code-scan \
            --value ghas-code-scan.json \
            --type GHAS_CODE_SCAN

      - name: Push attestation
        run: chainloop attestation push